description: 'External-evaluation design: for every internal training dataset (input/<institution>/<set>),
  which external test sets (input/external/...) to use under three conditions:'
conditions:
  cross_institution: same tissue, same platform, different institution
  cross_tissue: different tissue, same platform, different institution
  cross_tissue_same_institution: different tissue, same platform, SAME institution (added 2026-10-26 for the 3 pairs cross_tissue
    drops by the institution rule; test samples of the training institution are kept)
  cross_platform_xenium_to_visium: same tissue, different platform (xenium -> visium), different institution
  cross_platform_xenium_to_visium_hd: same tissue, different platform (xenium -> visium_hd), different institution
  cross_platform_visium_to_xenium: same tissue, different platform (visium -> xenium), different institution
  cross_platform_visium_to_visium_hd: same tissue, different platform (visium -> visium_hd), different institution
rules:
  overlap: test samples in the training set or its internal holdout are removed
  institution: test samples from the training institution are removed
  min_genes_measured:
    Visium: 10000
    Visium HD: 10000
    Xenium: 150
  cross_platform_tissues: 'tissues whose external sets include all of [''Visium'', ''Visium HD'', ''Xenium'']: [''Breast'',
    ''Colorectal'', ''Lung'']'
  gene_sets: 'per training set, one gene set for cross_institution + cross_tissue (also used for the internal holdout; Visium:
    top 200 by hmhvg rank, Xenium: whole intersection) and one for cross_platform (whole intersection of the training panel
    over its test samples)'
  excluded_pairs:
    wustl/PDAC -> external/hest/PAAD_xenium: only 2 hmhvg_200 genes measured
  same_institution_extra: cross_tissue_same_institution = lausanne/breast_xenium -> external/lausanne/LUNG_xenium, wustl/BRCA
    -> external/wustl/RCC, wustl/PDAC -> external/wustl/RCC. Added by scripts/make_cross_external_same_institution.py (input/cross_external/manifest_same_institution.csv;
    the main manifest.csv is unchanged). Not produced by scripts/make_external_design.py.
  institution_10x: 10x Genomics demo data and Janesick 2023 (10x) samples = one institution
  same_platform_controls: cross_platform_xenium_to_xenium and cross_platform_visium_to_visium dropped on 2026-10-27; the cross_platform
    gene set of a training set is the intersection over its different-platform test sets only
