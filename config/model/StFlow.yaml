GENERAL:
  use_amp: false
TRAINING:
  mode: max
  save_best_only: true
MODEL:
  model_name: st_flow.StFlow
  feature_dim: 1536
  hidden_dim: 128
  pairwise_hidden_dim: 128
  n_layers: 4
  n_heads: 4
  dropout: 0.2
  attn_dropout: 0.2
  n_neighbors: 8
  activation: swiglu
  prior_sampler: zinb
  zinb_total_count: 1
  zinb_logits: 0.1
  zinb_zi_logits: 0
  adapter: default
DATA:
  dataset_name: FlowDataset
  load_level: slide
  train_dataloader:
    batch_size: 1
