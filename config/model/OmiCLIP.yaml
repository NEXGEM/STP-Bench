MODEL:
  model_name: omiclip.OmiCLIP
  fine_tune: false
  model_path: local/checkpoints/omiclip/checkpoint.pt
  skip_train: true
  adapter: contrastive
  extra_preprocess:
  - script: cal_similarity_matrix.py
    args:
      model_path: ~
      external_meta_dir: ~
      text_batch_size: 32
DATA:
  dataset_name: BleepDataset
  load_level: slide
